<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <header class="site-header shell no-print">
    <a class="brand" href="#home" aria-label="Matheabenteuer Startseite"><span class="brand-icon" aria-hidden="true">m<span>✦</span></span><span>mathe<span class="brand-accent">abenteuer</span><small>KLEINE SCHRITTE. GROSSE ENTDECKUNGEN.</small></span></a>
